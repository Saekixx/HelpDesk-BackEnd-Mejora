name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js y caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Verificación estática de tipos
        run: npx tsc --noEmit -p tsconfig.json

      - name: Pruebas unitarias aisladas
        run: npx vitest run

      - name: Compilación de producción
        run: npm run build
