services:
  mongodb:
    image: mongo:latest
    container_name: helpdesk_mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    container_name: helpdesk_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --save 200 1 --loglevel warning

volumes:
  mongodb_data:
  redis_data:
